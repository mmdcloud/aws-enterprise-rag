name: "CI/CD & Security Validation Pipeline"

on:
  push:
    branches: ["main", "release/*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  python-test-suite:
    name: "Python Test Suite & Code Quality"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: "Code Formatting Check (Black)"
        run: black --check src tests

      - name: "Linting & Code Quality (Ruff)"
        run: ruff check src tests

      - name: "Execute Unit & Integration Tests"
        env:
          AWS_DEFAULT_REGION: us-east-1
          ENVIRONMENT: test
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml tests/

  terraform-validation:
    name: "Terraform Infrastructure Validation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: "Check Terraform Formatting"
        run: terraform fmt -check -recursive

      - name: "Initialize Terraform (Local Backend)"
        run: terraform init -backend=false

      - name: "Validate Terraform Configuration"
        run: terraform validate

      - name: "Security Scan with Checkov"
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: true

  docker-build-test:
    name: "Local Stack & Docker Verification"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Verify Docker Compose Configuration"
        run: docker compose config
