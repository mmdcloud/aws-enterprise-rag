[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-enterprise-rag"
version = "1.0.0"
description = "Production-grade Enterprise RAG with Event-Driven Ingestion, Bedrock Guardrails, and Redis Semantic Caching"
readme = "README.md"
authors = [{ name = "Enterprise Cloud Architecture Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "redis>=5.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pg8000>=1.30.0",
    "fastapi>=0.109.0",
    "mangum>=0.17.0",
    "pypdf>=3.17.0",
    "tenacity>=8.2.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "fakeredis>=2.21.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']
